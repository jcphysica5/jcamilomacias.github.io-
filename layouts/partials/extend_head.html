{{ if eq .Section "teaching" }}
<style>
  .teaching-section { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

  .teaching-header { margin-bottom: 2.5rem; }
  .teaching-header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
  .teaching-intro { color: var(--fg-secondary, #888); font-size: 1rem; }

  .course-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.75rem;
  }

  .course-card {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border-color, #333);
    border-radius: 8px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    background: var(--bg-secondary, #111);
  }
  .course-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    text-decoration: none;
  }

  .course-card-image {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
  }
  .course-card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
    margin: 0;
  }
  .course-card:hover .course-card-image img { transform: scale(1.04); }
  .course-card-image-placeholder {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  }

  .course-badge {
    position: absolute;
    top: 0.6rem; left: 0.6rem;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 0.7rem;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    letter-spacing: 0.03em;
    backdrop-filter: blur(4px);
  }

  .course-card-body {
    display: flex;
    flex-direction: column;
    flex: 1;
    padding: 1rem 1.1rem 1.1rem;
    gap: 0.5rem;
  }

  .course-card-title {
    font-size: 1rem;
    font-weight: 700;
    margin: 0;
    line-height: 1.35;
  }

  .course-card-desc {
    font-size: 0.85rem;
    color: var(--fg-secondary, #aaa);
    margin: 0;
    line-height: 1.5;
    flex: 1;
  }

  .course-card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    font-size: 0.75rem;
    color: var(--fg-secondary, #888);
  }
  .course-level, .course-tools {
    background: var(--bg-tertiary, #1e1e1e);
    border: 1px solid var(--border-color, #333);
    border-radius: 3px;
    padding: 0.15rem 0.4rem;
  }

  .course-card-cta {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent-color, #0af);
    margin-top: 0.25rem;
  }
</style>
{{ end }}
